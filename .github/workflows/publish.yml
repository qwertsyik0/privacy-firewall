name: Publish Privacy Firewall source

on:
  push:
    paths:
      - ".bootstrap/source/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct source and plugin
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source/part_* | base64 --decode > /tmp/privacy_firewall.py.gz
          gzip --decompress --stdout /tmp/privacy_firewall.py.gz > privacy_firewall.py
          cp privacy_firewall.py privacy_firewall.plugin

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile privacy_firewall.py
          test "$(sha256sum privacy_firewall.py | cut -d' ' -f1)" = "2c25bada0f86a94f174bd53d20317ad45dc8f2dcbf5087928db6b778eec763a7"
          cmp privacy_firewall.py privacy_firewall.plugin

      - name: Commit published files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add privacy_firewall.py privacy_firewall.plugin
          if git diff --cached --quiet; then
            echo "Published files are already current."
          else
            git commit -m "Publish Privacy Firewall 0.6.8 source and plugin"
            git push
          fi
